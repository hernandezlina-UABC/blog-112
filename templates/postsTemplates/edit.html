{% extends 'base.html' %}
{% load crispy_forms_tags %}


{% block title %}
    Edit Post
{% endblock %}

{% block content %}
    <h1>Edit Post</h1>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" value="Update" class="btn-solid theme-success">
    </form>
{% endblock %}
