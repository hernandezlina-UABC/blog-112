{% extends 'base.html' %}

{% block title %}
    All Posts
{% endblock %}

{% block content %}
    <h1>All Posts</h1>
    <ul>
        {% for item in posts %}
        <li>
            <h3>Title: {{ item.title }}</h3>
            <span><strong>Author: {{ item.author }}</strong></span><br/>
            <p>Body: {{ item.body|truncatechars:10 }}</p> 
            <a href="{% url 'post_detail' item.id %}">Continue reading...</a>
        </li>
        {% endfor %}
    </ul>
{% endblock %}
