{% extends 'base.html' %}

{% block title %}
    Delete Post
{% endblock %}

{% block content %}
    <h1>Delete Post</h1>
    <p>Are you sure you want to delete this post?</p>
    <form method="post">
        {% csrf_token %}
        <input type="submit" value="Confirm" class="btn-solid theme-danger">
    </form>
    <a href="{% url 'post_list' %}" class="btn-solid theme-secondary">Cancel</a>
{% endblock %}
