{% extends 'base.html' %}
{% load crispy_forms_tags %}


{% block title %}
    Reset Password
{% endblock %}

{% block content %}
    <h2>Forgot your password?</h2>
    <p>Enter your email address below, and we'll send you a link to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" value="Send Reset Link" class="btn-solid theme-primary">
    </form>
    <p>
        <a href="{% url 'login' %}">Back to login</a>
    </p>
{% endblock %}
