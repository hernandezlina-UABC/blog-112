{% extends 'base.html' %}

{% block title %}
    Change Password
{% endblock %}

{% block content %}
    <h1>Change Password</h1>
    <p>Please enter your old password, for security’s sake, and then enter your new password twice so we can verify you typed it in correctly.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Change Password" class="btn-solid theme-accent">
    </form>
{% endblock %}
