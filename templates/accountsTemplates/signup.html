{% extends 'base.html' %}
{% load crispy_forms_tags %}


{% block title %}
    Sign Up
{% endblock %}

{% block content %}
    <h1>Sign Up!</h1>
    <p>Create a new account!</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" value="Create" class="btn-solid theme-success">
    </form>
{% endblock %}
